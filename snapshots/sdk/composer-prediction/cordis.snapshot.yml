# Keyless composer-prediction composition. Main turns derive from the session
# fixture; the prediction request follows them in request order through the
# appended override entry, because both requests use the Session's own route.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay-main
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
    - id: composer-prediction
      name: '@deepseek-ai/dsh-experimental-composer-prediction'
      config:
        maxOutputTokens: 1024
        timeoutMs: 60000
        minAssistantMessages: 2
        maxUncachedTokens: 10000
